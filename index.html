.logo.mid{background-position:center}
.logo.on-dark{filter:brightness(0) invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.themed{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo.themed{filter:brightness(0) invert(1)}
.ic-inline{width:16px; height:16px; flex:none; stroke-width:1.7}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:var(--accent-ink); text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.eyebrow{font-family:var(--mono); font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-3)}

/* ---------------- shell ---------------- */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh}
.rail{background:var(--surface); border-right:1px solid var(--line); position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
.wordmark{padding:16px 18px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:11px}
.wordmark .div{width:1px; height:26px; background:var(--line)}
.wordmark .app-name{font-size:11.5px; color:var(--ink-3)}
.nav{padding:8px; overflow-y:auto; flex:1}
.nav-sec{padding:13px 10px 5px; display:flex; align-items:center; gap:6px}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; padding:7px 10px; border-radius:var(--r); color:var(--ink-2); text-align:left; font-size:13px; transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface-3); color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--brand-tint); color:var(--accent-ink); font-weight:600}
.nav-item .tally{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.nav-item .tally.hot{color:var(--attn); font-weight:600}
.nav-item.later{color:var(--ink-3); opacity:.72}
.nav-item.later:hover{opacity:1}
.nav-back{display:flex; align-items:center; gap:7px; padding:9px 12px; font-size:12px; color:var(--ink-3); border-bottom:1px solid var(--line)}
.nav-back:hover{color:var(--ink); background:var(--surface-2)}
.nav-proj{padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.nav-proj .n{font-size:13.5px; font-weight:600; line-height:1.25}
.nav-proj .r{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:3px}
.rail-foot{border-top:1px solid var(--line); padding:9px 10px; display:flex; align-items:center; gap:8px}
.avatar{width:27px; height:27px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--brand-tint); color:var(--accent-ink); font-size:10px; font-weight:600; font-family:var(--mono); border:1px solid var(--line)}
.avatar.sm{width:21px; height:21px; font-size:8.5px}
.avatar.lg{width:34px; height:34px; font-size:12px}

.topbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; padding:0 24px; height:54px}
.crumb{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-3); min-width:0; flex-wrap:wrap}
.crumb b{color:var(--ink); font-weight:600}
.crumb .sl{color:var(--line-2)}
.iconbtn{width:31px; height:31px; border-radius:var(--r); display:grid; place-items:center; color:var(--ink-2); border:1px solid transparent; flex:none}
.iconbtn:hover{background:var(--surface); border-color:var(--line); color:var(--ink)}
.iconbtn svg{width:16px; height:16px; stroke-width:1.7}
main{padding:22px 24px 70px; max-width:1420px}
.page-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.page-head h1{font-size:22px}
.page-head .sub{color:var(--ink-3); font-size:12.5px; margin-top:4px; max-width:70ch}
.page-head .actions{margin-left:auto; display:flex; gap:7px; align-items:center; flex-wrap:wrap}

/* ---------------- primitives ---------------- */
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:500; transition:background .12s,border-color .12s; white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn svg{width:14px; height:14px; stroke-width:1.9}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#F2FBFA}
:root[data-theme="dark"] .btn.primary{color:#052A26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#052A26}}
.btn.primary:hover{background:var(--brand-2); border-color:var(--brand-2)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:#00312D; font-weight:600}
.btn.accent:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3); color:var(--ink)}
.btn.sm{padding:4px 9px; font-size:11.5px}
.btn.sm svg{width:13px; height:13px}
.btn[disabled]{opacity:.45; cursor:not-allowed}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; gap:9px; padding:12px 15px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.card-h h3{font-size:13.5px}
.card-h .r{margin-left:auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card-b{padding:15px}
.card-b.flush{padding:0}

.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:600; font-family:var(--mono); border:1px solid transparent; white-space:nowrap; letter-spacing:.01em}
.chip .dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.chip.noissue{background:var(--noissue-t); color:var(--noissue)}
.chip.wip{background:var(--wip-t); color:var(--wip)}
.chip.ready{background:var(--ready-t); color:var(--ready)}
.chip.attn{background:var(--attn-t); color:var(--attn)}
.chip.resolved{background:var(--resolved-t); color:var(--resolved)}
.chip.brand{background:var(--brand-tint); color:var(--accent-ink)}
.chip.grey{background:var(--surface-3); color:var(--ink-3); border-color:var(--line)}
.chip.bcar{background:var(--brand); color:#EAFBF9; font-weight:600}
:root[data-theme="dark"] .chip.bcar{color:#062A26}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.bcar{color:#062A26}}

table{width:100%; border-collapse:collapse}
th{text-align:left; padding:8px 14px; font-family:var(--mono); font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap}
td{padding:10px 14px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
td.r,th.r{text-align:right}
.meter{height:5px; border-radius:100px; background:var(--surface-3); overflow:hidden; min-width:56px}
.meter i{display:block; height:100%; background:var(--accent); border-radius:100px}
.meter i.wip{background:var(--wip)} .meter i.attn{background:var(--attn)} .meter i.resolved{background:var(--resolved)}
.empty{padding:30px 16px; text-align:center; color:var(--ink-3); font-size:12.5px}
.stwrap{position:relative; display:inline-flex; align-items:center; border-radius:100px; border:1px solid transparent; padding-right:19px}
.stwrap svg{position:absolute; right:6px; width:11px; height:11px; pointer-events:none; opacity:.7; stroke-width:2.2}
.stsel{appearance:none; -webkit-appearance:none; background:none; border:0; color:inherit; cursor:pointer;
  font-family:var(--mono); font-size:11px; font-weight:600; padding:3px 2px 3px 9px}
.stsel:focus{outline:none}
.stwrap:focus-within{box-shadow:0 0 0 3px var(--brand-tint)}
.stwrap option{color:var(--ink); background:var(--surface)}
.stwrap.resolved{background:var(--resolved-t); color:var(--resolved); border-color:color-mix(in srgb,var(--resolved) 24%,transparent)}
.stwrap.attn{background:var(--attn-t); color:var(--attn); border-color:color-mix(in srgb,var(--attn) 24%,transparent)}
.stwrap.wip{background:var(--wip-t); color:var(--wip); border-color:color-mix(in srgb,var(--wip) 26%,transparent)}
.stwrap.noissue{background:var(--noissue-t); color:var(--noissue); border-color:color-mix(in srgb,var(--noissue) 24%,transparent)}
.stwrap.grey{background:var(--surface-3); color:var(--ink-3); border-color:var(--line)}

.grid{display:grid; gap:14px}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; align-items:center; gap:9px}
.wrap{flex-wrap:wrap}
.fact .k{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3)}
.fact .v{font-size:13.5px; font-weight:600; margin-top:2px}
.fact .v.mono{font-family:var(--mono); font-weight:500; letter-spacing:-.02em}

/* ---------------- KPI ---------------- */
.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:11px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:12px 13px 10px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent)}
.kpi.attn::before{background:var(--attn)} .kpi.wip::before{background:var(--wip)} .kpi.resolved::before{background:var(--resolved)}
.kpi .val{font-family:var(--mono); font-size:24px; font-weight:500; letter-spacing:-.04em; line-height:1}
.kpi .foot{font-size:11px; color:var(--ink-3)}

/* ---------------- project header ---------------- */
.phead{background:var(--brand); color:#EAFBF9; border-radius:var(--r-lg); padding:16px 20px; margin-bottom:16px; box-shadow:var(--shadow)}
:root[data-theme="dark"] .phead{background:var(--surface-3); color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .phead{background:var(--surface-3); color:var(--ink)}}
.phead .top{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap}
.phead h1{font-size:20px}
.phead .ref{font-family:var(--mono); font-size:11px; opacity:.72; margin-top:3px}
.phead .pills{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.phead-facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px 22px; margin-top:14px; padding-top:13px; border-top:1px solid rgba(255,255,255,.16)}
:root[data-theme="dark"] .phead-facts{border-top-color:var(--line-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .phead-facts{border-top-color:var(--line-2)}}
.phead-facts .k{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; opacity:.66}
.phead-facts .v{font-size:13px; font-weight:600; margin-top:2px}
.phead .chip.onsite{background:rgba(0,202,190,.18); color:#8CF0E9; border-color:rgba(0,202,190,.4)}
:root[data-theme="dark"] .phead .chip.onsite{background:var(--brand-tint); color:var(--accent-ink)}

/* stage tracking */
.stages{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px}
.stage{border:1px solid var(--line); border-radius:var(--r); padding:11px 12px; background:var(--surface); position:relative}
.stage.now{border-color:var(--accent); box-shadow:0 0 0 3px var(--brand-tint)}
.stage .no{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.stage .nm{font-size:11.5px; color:var(--ink-2); margin-top:1px; min-height:2.4em}
.stage .pc{font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.03em; margin-top:6px}
.stage .pc.done{color:var(--resolved)}
.stage .who{font-size:10.5px; color:var(--ink-3); margin-top:6px}

/* ---------------- BCAR inspection plan ---------------- */
.plan-group{border-bottom:1px solid var(--line)}
.plan-group:last-child{border-bottom:0}
.plan-gh{display:flex; align-items:center; gap:9px; padding:9px 15px; background:var(--surface-2); cursor:pointer; width:100%; text-align:left}
.plan-gh:hover{background:var(--surface-3)}
.plan-gh .seq{font-family:var(--mono); font-size:10px; color:var(--ink-3); width:18px; flex:none}
.plan-gh .t{font-size:12.5px; font-weight:600; color:var(--accent-ink)}
.plan-gh .m{margin-left:auto; display:flex; align-items:center; gap:9px}
.plan-gh .caret{transition:transform .16s; color:var(--ink-3)}
.plan-gh[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.plan-item{display:flex; align-items:center; gap:11px; padding:8px 15px 8px 46px; border-top:1px solid var(--line); font-size:12.5px}
.plan-item:hover{background:var(--surface-2)}
.plan-item .t{flex:1; min-width:0; color:var(--ink-2)}
.plan-item .ct{font-family:var(--mono); font-size:11px; color:var(--ink-3); width:44px; text-align:right; flex:none}
.plan-item .ct b{color:var(--ink)}
.plan-item .sd{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line-2); flex:none}
.plan-item .sd.noissue{background:var(--noissue); border-color:var(--noissue)}
.plan-item .sd.wip{background:var(--wip); border-color:var(--wip)}
.plan-item .sd.attn{background:var(--attn); border-color:var(--attn)}
.plan-item .sd.resolved{background:var(--resolved); border-color:var(--resolved)}
.plan-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-3); padding:11px 15px; border-top:1px solid var(--line); background:var(--surface-2)}
.plan-legend span{display:flex; align-items:center; gap:6px}
.plan-legend i{width:9px; height:9px; border-radius:50%; display:block}

/* ---------------- findings editor ---------------- */
.finding{display:grid; grid-template-columns:132px minmax(0,1fr) 176px; gap:14px; padding:14px 15px; border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}
.finding:hover{background:var(--surface-2)}
.fref{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-bottom:5px; display:flex; align-items:center; gap:5px}
.photo{aspect-ratio:4/3; border-radius:var(--r); border:1px solid var(--line); position:relative; overflow:hidden; background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--surface-2)) 0 7px, var(--surface-2) 7px 14px); display:flex; align-items:flex-end; padding:5px}
.photo .tag{font-family:var(--mono); font-size:8.5px; color:var(--ink-3); background:var(--surface); padding:1px 4px; border-radius:3px; border:1px solid var(--line)}
.photo.sq{aspect-ratio:1}
.gps{font-family:var(--mono); font-size:9px; color:var(--ink-3); margin-top:4px; line-height:1.35; word-break:break-all}
.fcomment{width:100%; min-height:76px; resize:vertical; font:inherit; font-size:12.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:8px 9px}
.fcomment:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--brand-tint)}
.fcomment::placeholder{color:var(--ink-3)}
.fmeta{display:flex; gap:8px; flex-wrap:wrap; margin-top:7px; align-items:center}
.fopts{display:flex; flex-direction:column; gap:6px}
.opt{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-2)}
.opt .lbl{flex:1; min-width:0}
.sw{width:30px; height:17px; border-radius:100px; background:var(--line-2); position:relative; flex:none; transition:background .14s}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .14s; box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(13px)}
.flinks{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line)}
.flink{font-size:11px; color:var(--accent-ink); text-decoration:underline; text-decoration-color:color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset:2px}
.flink:hover{color:var(--ink)}
.autosave{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-3); padding:9px 15px; border-top:1px solid var(--line); background:var(--surface-2)}
.autosave .pulse{width:6px; height:6px; border-radius:50%; background:var(--resolved); flex:none; animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:.35} 50%{opacity:1}}

/* ---------------- locate images ---------------- */
.locate{display:grid; grid-template-columns:126px minmax(0,1fr); gap:0; align-items:stretch}
.locate-strip{border-right:1px solid var(--line); overflow-y:auto; max-height:560px; padding:9px; display:flex; flex-direction:column; gap:8px; background:var(--surface-2)}
.strip-item{border:1.5px solid transparent; border-radius:var(--r); padding:3px; text-align:left; width:100%}
.strip-item[aria-pressed="true"]{border-color:var(--accent); background:var(--brand-tint)}
.strip-item .n{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); margin-bottom:3px; display:flex; justify-content:space-between; align-items:center}
.dwg{position:relative; padding:12px; overflow:auto; max-height:560px}
.dwg svg{display:block; width:100%; min-width:520px; height:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.pin{cursor:pointer}
.pin circle{stroke:#0B1F1C; stroke-width:.35}
.pin text{font-family:var(--mono); font-size:1.15px; font-weight:600; pointer-events:none}
.pin.sel circle{stroke-width:.9; stroke:var(--ink)}
.dwg-bar{display:flex; align-items:center; gap:9px; padding:9px 15px; border-bottom:1px solid var(--line); flex-wrap:wrap; background:var(--surface-2)}
.hint{font-size:11.5px; color:var(--ink-3); max-width:70ch}

/* ---------------- report preview ---------------- */
.sheet{background:#fff; color:#111; border-radius:4px; box-shadow:var(--shadow-lift); padding:40px 44px; max-width:720px; margin:0 auto; font-family:var(--sans)}
.sheet .lh{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding-bottom:22px; border-bottom:1px solid #d8d8d8}
.sheet .lh h2{font-size:22px; font-weight:500; color:#111; letter-spacing:-.01em}
.sheet .lh .wm{text-align:right; line-height:.95}
.sheet .pairs{display:grid; grid-template-columns:1fr 1fr; gap:17px 26px; margin-top:22px}
.sheet .pair .k{font-size:12px; color:#444}
.sheet .pair .v{font-size:13.5px; color:#111; margin-top:2px; font-weight:500}
.sheet .pair.r{text-align:right}
.sheet .band{margin-top:24px; padding:14px 15px; background:#f4f4f4; border-radius:4px; font-size:12px; color:#333}
.sheet .qr{width:66px; height:66px; flex:none; background:#111; border-radius:3px; display:grid; place-items:center; color:#fff; font-family:var(--mono); font-size:7px; text-align:center; line-height:1.2}
.sheet-f{display:flex; justify-content:space-between; font-size:10px; color:#777; border-top:1px solid #e4e4e4; margin-top:26px; padding-top:9px; font-family:var(--mono)}
.sheet .fpage{display:grid; grid-template-columns:190px minmax(0,1fr); gap:20px; padding:18px 0; border-bottom:1px solid #ececec}
.sheet .fpage:last-child{border-bottom:0}
.sheet .fpage .rc{text-align:right}
.sheet .fpage .rc .k{font-size:10.5px; color:#666; margin-top:11px}
.sheet .fpage .rc .v{font-size:12.5px; color:#111; font-weight:600}
.sheet .ph{aspect-ratio:4/3; border:1px solid #ddd; border-radius:3px; background:repeating-linear-gradient(135deg,#f0f0f0 0 7px,#f7f7f7 7px 14px); display:flex; align-items:flex-end; padding:5px}
.sheet .ph span{font-family:var(--mono); font-size:8px; color:#777; background:#fff; border:1px solid #e0e0e0; padding:1px 4px; border-radius:2px}
.sheet .cm{font-size:12.5px; color:#111; line-height:1.45}
.sheet .mapmini{margin-top:7px; border:1px solid #ddd; border-radius:3px; overflow:hidden}
.sheet .gpsline{font-family:var(--mono); font-size:8px; color:#777; margin-top:4px}

/* ---------------- contractor portal ---------------- */
.portal{background:#0E1D1B; color:#E6F2F0; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow-lift)}
.portal-h{padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.12); display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
.portal-h .brandline{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#00CABE}
.portal-h h2{font-size:18px; margin-top:4px}
.portal-h .refbox{margin-left:auto; text-align:right; font-family:var(--mono)}
.portal-h .refbox .k{font-size:9px; letter-spacing:.12em; text-transform:uppercase; opacity:.6}
.portal-h .refbox .v{font-size:17px; font-weight:600; color:#00CABE}
.portal-b{padding:16px 20px 22px; display:flex; flex-direction:column; gap:12px}
.pissue{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:var(--r); padding:13px 14px}
.pissue .top{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap}
.pissue .ref{font-family:var(--mono); font-size:10.5px; color:#8FA8A4}
.pissue h4{font-size:13px; margin-top:2px; font-weight:600}
.pissue .el{font-size:11px; color:#8FA8A4; margin-top:3px}
.pthread{margin-top:11px; padding-top:11px; border-top:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; gap:9px}
.pmsg{display:flex; gap:9px}
.pmsg .av{width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--mono); font-size:8.5px; font-weight:600; background:rgba(0,202,190,.16); color:#7FE9E2}
.pmsg .bd{min-width:0}
.pmsg .who{font-size:11px; font-weight:600}
.pmsg .who span{font-weight:400; color:#8FA8A4; font-family:var(--mono); font-size:9.5px; margin-left:6px}
.pmsg p{font-size:12px; color:#CFE0DD; margin-top:2px}
.preply{display:flex; gap:8px; margin-top:11px}
.preply input{flex:1; min-width:0; font:inherit; font-size:12px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#E6F2F0; border-radius:var(--r); padding:7px 10px}
.preply input::placeholder{color:#7C948F}
.preply input:focus{outline:none; border-color:#00CABE}
.chip.pchip{background:rgba(255,255,255,.08); color:#CFE0DD; border-color:rgba(255,255,255,.14)}

.mmap{border:1px solid var(--line); border-radius:6px; overflow:hidden}
.pphotos{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:11px}
.pphoto{aspect-ratio:4/3; border-radius:5px; border:1px solid rgba(255,255,255,.14); overflow:hidden;
  background:repeating-linear-gradient(135deg,#16302B 0 7px,#1D3B35 7px 14px); display:flex; align-items:flex-end; padding:4px}
.pphoto span{font-family:var(--mono); font-size:8px; color:#8FA8A4}
.pphoto.map{background:#EFEDE7; padding:0; display:block}
.pphoto-cap{font-size:10.5px; color:#8FA8A4; margin-top:6px}
/* ---------------- mobile capture ---------------- */
.phone{width:322px; margin:0 auto; border:9px solid #0B1F1C; border-radius:34px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow-lift); position:relative}
.phone-notch{height:22px; background:#0B1F1C; display:grid; place-items:center}
.phone-notch i{width:56px; height:5px; border-radius:100px; background:#3A4F4B; display:block}
.phone-b{height:520px; overflow-y:auto; background:var(--bg)}
.mrow{padding:11px 13px; border-bottom:1px solid var(--line); background:var(--surface)}
.mhead{background:var(--brand); color:#EAFBF9; padding:11px 13px}
:root[data-theme="dark"] .mhead{background:var(--surface-3); color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mhead{background:var(--surface-3); color:var(--ink)}}
.mhead .t{font-size:13.5px; font-weight:600}
.mhead .s{font-family:var(--mono); font-size:9.5px; opacity:.75; margin-top:2px}
.mcam{aspect-ratio:4/3; background:repeating-linear-gradient(135deg,#1a2c29 0 9px,#223833 9px 18px); display:grid; place-items:center; color:#7FE9E2; position:relative}
.mcam .shutter{width:48px; height:48px; border-radius:50%; border:3px solid #7FE9E2; display:grid; place-items:center}
.mcam .badge{position:absolute; bottom:7px; left:7px; font-family:var(--mono); font-size:8.5px; color:#CFE0DD; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:3px}
.mstat{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.mstat button{padding:7px 6px; border:1px solid var(--line); border-radius:var(--r); font-size:10.5px; font-weight:600; font-family:var(--mono); color:var(--ink-2); background:var(--surface)}
.mstat button[aria-pressed="true"]{border-color:currentColor}
.mstat button.attn[aria-pressed="true"]{background:var(--attn-t); color:var(--attn)}
.mstat button.wip[aria-pressed="true"]{background:var(--wip-t); color:var(--wip)}
.mstat button.noissue[aria-pressed="true"]{background:var(--noissue-t); color:var(--noissue)}
.mstat button.ready[aria-pressed="true"]{background:var(--ready-t); color:var(--ready)}

/* ---------------- settings form ---------------- */
.sgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:11px 18px}
.srow{display:flex; flex-direction:column; gap:4px; min-width:0}
.srow label{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3)}
.srow input, .srow select, .srow textarea{font:inherit; font-size:12.5px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line); border-radius:var(--r); padding:6px 8px; width:100%}
.srow input[readonly]{color:var(--ink-3); background:var(--surface-3)}
.srow input:focus, .srow select:focus, .srow textarea:focus{outline:none; border-color:var(--accent); background:var(--surface); box-shadow:0 0 0 3px var(--brand-tint)}
.cinput{font:inherit; font-size:12px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line);
  border-radius:4px; padding:4px 6px; width:100%; min-width:118px}
.cinput:focus{outline:none; border-color:var(--accent); background:var(--surface)}
.tick{width:17px; height:17px; border-radius:4px; border:1.5px solid var(--line-2); flex:none; display:grid;
  place-items:center; color:transparent; background:var(--surface)}
.tick:hover{border-color:var(--accent)}
.tick svg{width:11px; height:11px; stroke-width:2.6}
.tick.on{background:var(--accent); border-color:var(--accent); color:#00312D}
.fchips{display:flex; gap:5px; flex-wrap:wrap}
.fchip{padding:4px 10px; border-radius:100px; border:1px solid var(--line); background:var(--surface);
  font-size:11.5px; font-family:var(--mono); color:var(--ink-2)}
.fchip:hover{border-color:var(--line-2); color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:600}

/* ---------------- task calendar ---------------- */
.cal-wrap{overflow-x:auto}
.cal{display:grid; min-width:900px}
.cal.dense{min-width:1180px}
.cal.dense .cal-cell, .cal.dense .cal-emp{height:70px}
.cal.dense .cal-emp .eyebrow{display:none}
.cal.dense .cal-emp > .row > span:last-child > span:first-child{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cal.dense .cal-emp{padding:7px 9px}
.cal-h.wkstart, .cal-cell.wkstart{border-left:2px solid var(--line-2)}
.cal-h{padding:9px 11px; background:var(--surface-2); border-bottom:1px solid var(--line);
  border-left:1px solid var(--line); display:flex; flex-direction:column; gap:1px}
.cal-h span{font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3)}
.cal-h b{font-size:12.5px; font-weight:600}
.cal-h.today{background:var(--brand-tint)}
.cal-h.today b{color:var(--accent-ink)}
.cal-h .tdot{color:var(--accent-ink); font-weight:600}
.cal-emp-h{border-left:0}
.cal-emp{padding:8px 10px; height:92px; overflow:hidden; border-bottom:1px solid var(--line); background:var(--surface-2);
  display:flex; flex-direction:column; gap:8px; justify-content:space-between}
.cal-emp .load{display:flex; align-items:center; gap:7px}
.cal-emp .load .meter{flex:1}
.cal-emp .load .num{font-size:10.5px; color:var(--ink-3)}
.cal-emp .load .num.over{color:var(--attn); font-weight:600}
.cal-cell{border-left:1px solid var(--line); border-bottom:1px solid var(--line); padding:5px;
  flex-direction:row !important; align-items:stretch; height:92px; overflow:hidden;
  display:flex; gap:3px; position:relative}
.cal-cell.today{background:color-mix(in srgb, var(--brand-tint) 45%, transparent)}
.cal-cell.hot{box-shadow:inset 0 2px 0 var(--attn)}
.cellh{position:absolute; top:5px; right:6px; font-family:var(--mono); font-size:9.5px; color:var(--ink-3)}
.cellh.over{color:var(--attn); font-weight:600}
.ctask{display:flex; flex-direction:column; gap:2px; text-align:left; flex:1 1 0; min-width:0; overflow:hidden;
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:5px; padding:5px 6px; transition:box-shadow .12s, transform .12s}
.ctask:hover{box-shadow:var(--shadow); transform:translateY(-1px)}
.ctask.done{opacity:.55}
.ctask.done .ct{text-decoration:line-through}
.ctop{display:flex; align-items:baseline; gap:6px}
.cref{font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.04em; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ch{margin-left:auto; font-family:var(--mono); font-size:9.5px; font-weight:600; color:var(--ink-2); flex:none}
.ch.full{color:var(--resolved)}
.cal.dense .ct, .cal.dense .cbot{display:none}
.cal.dense .ctask{padding:4px; border-left-width:3px; background:color-mix(in srgb, var(--pc) 13%, var(--surface))}
.cal.dense .ctop{flex-direction:column; gap:0; align-items:flex-start}
.cal.dense .cref{font-size:8px; max-width:100%}
.cal.dense .ch{margin-left:0; font-size:9px}
.cal.dense .cell-add{display:none}
.cal.dense .cal-emp .load .num{display:none}
.cal-cell:has(.ctask + .ctask) .ct{-webkit-line-clamp:3}
.ct{font-size:11px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.cbot{display:flex; align-items:center; gap:4px; font-family:var(--mono); font-size:8.5px; color:var(--ink-3)}
.cbot svg{width:9px; height:9px}
.clog{margin-left:auto; color:var(--resolved)}
.cell-add{align-self:flex-end; margin-left:auto; flex:none; width:20px; height:20px; border-radius:4px;
  display:grid; place-items:center; color:var(--ink-3); opacity:0; transition:opacity .12s}
.cal-cell:hover .cell-add{opacity:1}
.cell-add:hover{background:var(--surface-3); color:var(--ink)}
.cell-add svg{width:12px; height:12px}
.ctask{cursor:grab}
.ctask:active{cursor:grabbing}
.ctask.dragging{opacity:.35}
.cal-cell.drop-on{background:var(--brand-tint); box-shadow:inset 0 0 0 2px var(--accent)}
.cshare{display:inline-flex; align-items:center; gap:2px; color:var(--accent-ink); font-weight:600}
.cshare svg{width:9px; height:9px}
.whopick{display:flex; flex-wrap:wrap; gap:5px}
.whopick .fchip{display:inline-flex; align-items:center; padding:3px 9px 3px 4px}
.logrow{display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px}
.logrow:last-child{border-bottom:0}

/* ---------------- issue timeline ---------------- */
.tl{display:flex; flex-direction:column; gap:0; position:relative}
.tl-item{display:flex; gap:11px; padding:0 0 14px; position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:""; position:absolute; left:12px; top:26px; bottom:0; width:1px; background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-ic{width:25px; height:25px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--surface-3); color:var(--ink-2); border:1px solid var(--line); z-index:1}
.tl-ic svg{width:13px; height:13px}
.tl-ic.raised{background:var(--attn-t); color:var(--attn); border-color:transparent}
.tl-ic.reply{background:var(--brand-tint); color:var(--accent-ink); border-color:transparent}
.tl-ic.assign{background:var(--noissue-t); color:var(--noissue); border-color:transparent}
.tl-ic.recheck{background:var(--wip-t); color:var(--wip); border-color:transparent}
.tl-ic.closed{background:var(--resolved-t); color:var(--resolved); border-color:transparent}
.tl-bd{min-width:0; flex:1; padding-top:2px}
.tl-h{display:flex; gap:7px; align-items:baseline; flex-wrap:wrap; font-size:12.5px; font-weight:600}
.tl-co{font-family:var(--mono); font-size:9.5px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3)}
.tl-d{font-family:var(--mono); font-size:10px; color:var(--ink-3); margin-left:auto}
.tl-bd p{font-size:12.5px; color:var(--ink-2); margin-top:3px}
.passign{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1)}

/* ---------------- home launcher ---------------- */
.home{min-height:100vh; background:#08110F; color:#E6F2F0; display:grid; place-items:center; padding:44px 20px}
.home-in{width:100%; max-width:1120px; text-align:center}
.home-mark{display:inline-block}
.home-eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#5E7B77; margin:48px 0 20px}
.home-cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; text-align:left}
.hcard{text-align:left; background:#0E1D1B; border:1px solid #1E322F; border-radius:12px; padding:20px 20px 18px;
  display:flex; flex-direction:column; gap:11px; color:inherit; transition:border-color .16s, transform .16s, background .16s}
.hcard:hover{border-color:#00CABE; transform:translateY(-2px); background:#112320}
.hcard-top{display:flex; align-items:flex-start}
.hcard-ic{width:38px; height:38px; border-radius:9px; background:rgba(0,202,190,.12); color:#7FE9E2;
  display:grid; place-items:center; border:1px solid rgba(0,202,190,.22)}
.hcard-ic svg{width:19px; height:19px}
.hcard-go{margin-left:auto; color:#4A6763; transition:color .16s, transform .16s}
.hcard:hover .hcard-go{color:#00CABE; transform:translate(2px,-2px)}
.hcard h3{font-size:16px; color:#F2FBFA}
.hcard p{font-size:12px; line-height:1.55; color:#93AAA6}
.hcard-badge{margin-top:auto; display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:#7FE9E2; background:rgba(0,202,190,.09); border:1px solid rgba(0,202,190,.24);
  border-radius:100px; padding:5px 11px; text-align:center}
.hcard-meta{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#4A6763; text-align:center}
@media (max-width:900px){ .home-cards{grid-template-columns:1fr} }

/* ---------------- wireframe shell ---------------- */
.wshell{display:grid; grid-template-columns:266px minmax(0,1fr); min-height:100vh}
.wnav{background:var(--surface); border-right:1px solid var(--line); padding:0 0 26px; overflow-y:auto; max-height:100vh}
.wback{display:flex; align-items:center; gap:8px; padding:13px 18px; font-size:12px; color:var(--ink-3);
  border-bottom:1px solid var(--line); width:100%; text-align:left}
.wback:hover{color:var(--ink); background:var(--surface-2)}
.wnav-h{padding:16px 18px; border-bottom:1px solid var(--line)}
.wnav-h h2{font-size:16px; margin-top:3px}
.wnav-h p{font-size:11.5px; color:var(--ink-3); margin-top:6px; line-height:1.5}
.wnav-h .btn{margin-top:11px}
.wgrp{padding:12px 8px 0}
.wgrp .eyebrow{padding:0 10px 5px}
.wnav-i{display:flex; align-items:center; gap:9px; width:100%; padding:7px 10px; border-radius:var(--r);
  font-size:12.5px; color:var(--ink-2); text-align:left}
.wnav-i:hover{background:var(--surface-3); color:var(--ink)}
.wnav-i.on{background:var(--brand-tint); color:var(--accent-ink); font-weight:600}
.wnum{font-family:var(--mono); font-size:9.5px; color:var(--ink-3); flex:none}
.wnav-i.on .wnum{color:var(--accent-ink)}
.wstage{padding:30px 26px 60px; display:flex; gap:30px; align-items:flex-start; flex-wrap:wrap; justify-content:center}
.wcap{max-width:340px; flex:1 1 260px; padding-top:12px}
.wcap h3{font-size:20px; margin-top:4px}
.wcap p{font-size:13px; color:var(--ink-2); line-height:1.6; margin-top:10px}
.wcap-f{display:flex; align-items:center; gap:8px; margin-top:16px; padding-top:13px;
  border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-3)}

/* phone frame */
.phone2{display:block; width:328px; flex:none; border:10px solid #0B1F1C; border-radius:38px; overflow:hidden;
  background:var(--bg); box-shadow:var(--shadow-lift); position:relative}
.p2-notch{height:24px; background:#0B1F1C; display:grid; place-items:center}
.p2-notch i{width:60px; height:5px; border-radius:100px; background:#33504C; display:block}
.p2-status{display:flex; justify-content:space-between; align-items:center; padding:5px 14px;
  font-family:var(--mono); font-size:8.5px; color:var(--ink-3); background:var(--surface); border-bottom:1px solid var(--line)}
.p2-status svg{width:8px; height:8px; vertical-align:-1px}
.p2-body{height:604px; overflow-y:auto; background:var(--bg); display:flex; flex-direction:column}
.phone2.sm{width:242px; border-width:7px; border-radius:28px; cursor:pointer; transition:transform .16s, box-shadow .16s}
.phone2.sm:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.phone2.sm .p2-body{height:452px; pointer-events:none}
.phone2.sm .p2-notch{height:16px}
.phone2.sm .p2-notch i{width:42px; height:4px}

/* gallery */
.wgal{padding:0 0 60px}
.wgal-h{display:flex; align-items:center; gap:18px; padding:0 22px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.wgal-h .wback{width:auto; border-bottom:0; padding:14px 0}
.wgal-h h2{font-size:17px; margin-top:2px}
.wgal-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(242px,1fr)); gap:26px 20px; padding:26px 22px}
.wgal-i{display:flex; flex-direction:column; gap:9px; align-items:center}
.wgal-cap{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; align-self:flex-start}

/* ---------------- mobile screen internals ---------------- */
.mh{display:flex; align-items:flex-start; gap:9px; padding:12px 13px; background:var(--brand); color:#EAFBF9}
:root[data-theme="dark"] .mh{background:var(--surface-3); color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mh{background:var(--surface-3); color:var(--ink)}}
.mback{color:inherit; opacity:.85; padding-top:1px}
.mback svg{width:15px; height:15px}
.mh-t{font-size:13.5px; font-weight:600; line-height:1.25}
.mh-s{font-family:var(--mono); font-size:9px; opacity:.75; margin-top:3px}
.mbody{flex:1; overflow-y:auto}
.mstrip{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line)}
.mstat{background:var(--surface); padding:9px 10px; display:flex; flex-direction:column; gap:2px}
.mstat .k{font-family:var(--mono); font-size:8px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3)}
.mstat .v{font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:-.03em}
.msect{font-family:var(--mono); font-size:8.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-3);
  padding:12px 13px 5px; background:var(--bg)}
.mrow2{display:flex; align-items:center; gap:9px; padding:11px 13px; background:var(--surface);
  border-bottom:1px solid var(--line); width:100%; text-align:left; color:inherit}
.mrow2.tap:hover{background:var(--surface-2)}
.mrow-t{font-size:12.5px; font-weight:500; line-height:1.35}
.mrow-s{font-family:var(--mono); font-size:9px; color:var(--ink-3); margin-top:3px}
.mrow-r{flex:none}
.mchev{color:var(--ink-3); flex:none}
.mchev svg{width:13px; height:13px}
.mcard{background:var(--surface); border-bottom:1px solid var(--line); padding:4px 13px}
.mkv{display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:12px;
  border-bottom:1px solid var(--line)}
.mkv:last-child{border-bottom:0}
.mkv span{color:var(--ink-3)}
.mgrid2{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px 13px 14px}
.mbig{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 10px;
  display:flex; flex-direction:column; gap:7px; font-size:11.5px; font-weight:500; text-align:left; color:inherit}
.mbig:hover{border-color:var(--accent)}
.mbig span{color:var(--accent-ink)}
.mtabs{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); background:var(--surface)}
.mtab{padding:8px 4px 9px; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-family:var(--mono); font-size:8px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3)}
.mtab.on{color:var(--accent-ink); font-weight:600}
.mtab svg{width:16px; height:16px}
.mnote{display:flex; gap:8px; align-items:flex-start; padding:10px 11px; margin:12px 13px; border-radius:7px;
  background:var(--brand-tint); color:var(--accent-ink); font-size:10.5px; line-height:1.45}
.mnote.warn{background:var(--wip-t); color:var(--wip)}
.mnote svg{width:13px; height:13px; flex:none; margin-top:1px}
.mlock{display:flex; gap:8px; align-items:flex-start; padding:10px 11px; border-radius:7px; font-size:11.5px;
  background:var(--brand-tint); color:var(--accent-ink); border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent)}
.mlock svg{width:13px; height:13px; flex:none; margin-top:1px}
.mseg{display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.mseg button{flex:1; padding:7px 6px; font-size:11.5px; font-family:var(--mono); color:var(--ink-3); border-right:1px solid var(--line)}
.mseg button:last-child{border-right:0}
.mseg button.on{background:var(--brand-tint); color:var(--accent-ink); font-weight:600}
.mprog{display:flex; align-items:center; gap:9px; padding:10px 13px; background:var(--surface); border-bottom:1px solid var(--line)}
.mprog .meter{flex:1}
.mprog span{font-family:var(--mono); font-size:9px; color:var(--ink-3)}
.sd{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line-2); display:block; flex:none}
.sd.noissue{background:var(--noissue); border-color:var(--noissue)}
.sd.wip{background:var(--wip); border-color:var(--wip)}
.sd.attn{background:var(--attn); border-color:var(--attn)}
.sd.resolved{background:var(--resolved); border-color:var(--resolved)}
.mphoto{aspect-ratio:4/3; border-bottom:1px solid var(--line); position:relative; display:flex; align-items:flex-end; padding:7px;
  background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent) 11%, var(--surface-2)) 0 8px, var(--surface-2) 8px 16px)}
.mphoto .tag{font-family:var(--mono); font-size:8.5px; color:var(--ink-3); background:var(--surface);

/* ===================== project shell ===================== */
function viewProject(){
  const p = byId(state.pid);
  const oi = p.inspections.reduce((n,i) => n + issueCount(i), 0);
  const head = '<section class="phead"><div class="top">'
    + '<div><h1>'+p.name+'</h1><div class="ref">'+p.ref+' &middot; '+p.desc+'</div></div>'
    + '<div class="pills">'+statusControl(p)+'<span class="chip onsite"><i class="dot"></i>'+STAGES[p.stage].no+' &middot; '+STAGES[p.stage].nm+'</span>'
    + (oi ? '<span class="chip attn">'+oi+' open issues</span>' : '<span class="chip resolved">No open issues</span>')
    + visitFlag(p)
    + '</div></div>'
    + '<div class="phead-facts">'
    + [["Client", p.client],["Division", p.division],["Project leader", p.leader],["Assigned certifier", p.inspector],
       ["Project drawing", p.drawing],["Sector", p.sector],["Start date", p.start],
       ["Fee account", canSeeFinance() ? eur(p.fee) : '<span style="opacity:.6">'+svg(I.lock,2)+' restricted</span>']]
      .map(f => '<div><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>').join("")
    + '</div></section>';
  return head + secPanel(p);
}
function secPanel(p){
  const it = pnavItem(state.sec);
  if(it && it.later) return panelLater(it.t);
  if(it && it.fin && !canSeeFinance()) return panelRestricted();
  switch(state.sec){
    case "settings": return panelSettings(p);
    case "tasks": return panelTasks(p);
    case "issues": return panelIssues(p);
    case "checklist": return panelChecklist(p);
    case "inspections": return state.ino ? panelInspection(p, insp(p, state.ino)) : panelInspections(p);
    case "plan": return panelPlan(p);
    case "drawings": return panelDrawings(p);
    case "contacts": return panelContacts(p);
    case "invoices": return panelInvoices(p);
    case "payments": return panelPayments(p);
    default: return panelOverview(p);
  }
}

/* schematic site plan + numbered pins */
function siteplan(){
  let g = '<rect x="0" y="0" width="100" height="70" fill="none"/>';
  g += '<path d="M4 62 L18 20 L86 12 L96 52 L60 66 Z" fill="none" stroke="var(--line-2)" stroke-width="0.5" stroke-dasharray="2 1.4"/>';
  g += '<path d="M10 56 C30 48 52 44 92 40" fill="none" stroke="var(--ink-3)" stroke-width="1.6" opacity=".35"/>';
  g += '<path d="M22 30 C40 34 58 30 84 22" fill="none" stroke="var(--ink-3)" stroke-width="1.1" opacity=".28"/>';
  for(let r=0;r<3;r++) for(let c=0;c<9;c++){
    const x = 20 + c*7.4 + r*2.4, y = 22 + r*12;
    g += '<rect x="'+x+'" y="'+y+'" width="6" height="8.4" rx="0.6" fill="var(--surface-3)" stroke="var(--line-2)" stroke-width="0.35"/>';
  }
  g += '<text x="66" y="62" font-family="IBM Plex Mono" font-size="1.7" fill="var(--ink-3)">RESIDENTIAL ZONED LANDS</text>';
  g += '<text x="5" y="9" font-family="IBM Plex Mono" font-size="1.9" fill="var(--ink-3)">0464P-C-201 rev D &mdash; DRAINAGE LAYOUT</text>';
  return g;
}

/* ---------- BCAR inspection plan ---------- */
function panelPlan(p){
  const hasBcar = p.inspections.some(i => i.type === "BCAR");
  if(!hasBcar) return '<section class="card"><div class="card-b"><div class="empty">No BCAR inspections on this project, so no inspection plan applies. Non-BCAR inspections record findings without a predefined element order.</div></div></section>';
  const GP = planGroups(p);
  const tpl = PLAN_TEMPLATES.find(x => x.id === p.planTemplate) || PLAN_TEMPLATES[0];
  let done = 0, total = 0;
  GP.forEach(([,items]) => items.forEach(it => { total++; if(it[1] > 0) done++; }));
  return '<div class="stack">'
    + '<div class="page-head" style="margin:0"><div><h1 style="font-size:18px">Inspection Plan</h1>'
      + '<div class="sub">The approved BCAR plan for '+p.ref+'. Elements are inspected in this order; each one collects its own findings and rolls up to the certificate of compliance.</div></div>'
      + '<div class="actions"><button class="btn sm" data-act="soon">'+svg(I.dl)+'Excel</button>'
      + '<button class="btn sm" data-act="soon">Print</button>'
      + '<button class="btn sm" data-sec="inspections">Inspections</button>'
      + '<button class="btn sm" data-act="issuesummary">Issues summary</button>'
      + '<button class="btn sm primary" data-act="soon">Edit inspection plan</button></div></div>'
    + '<section class="card"><div class="card-b" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">'
      + '<div class="fact" style="flex:1; min-width:220px"><div class="k">Plan template</div>'
      + '<div class="v" style="margin-top:3px">'+tpl.n+'</div></div>'
      + '<div class="srow" style="min-width:240px"><label>Change template</label><select data-tpl>'
      + PLAN_TEMPLATES.map(t => '<option value="'+t.id+'"'+(t.id===p.planTemplate?" selected":"")+'>'+t.n+'</option>').join("")
      + '</select></div>'
      + '<p class="hint" style="flex:1 1 260px">Templates are held once for the practice. Picking one loads its elements, in order, onto this project. Changing it here does not delete findings already recorded.</p>'
      + '</div></section>'
    + '<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr))">'
    + kpiTile("Plan elements", total, GP.length + " groups", "")
    + kpiTile("Elements inspected", done, Math.round(done/total*100) + "% of plan", "resolved")
    + kpiTile("Findings recorded", GP.reduce((n,[,it]) => n + it.reduce((m,x) => m + x[1], 0), 0), "across all elements", "")
    + kpiTile("Elements needing attention", GP.reduce((n,[,it]) => n + it.filter(x => x[3] === "attn").length, 0), "open issues outstanding", "attn")
    + '</div>'
    + '<section class="card"><div class="card-h">'+svg(I.list,1.8)+'<h3>'+p.ref+' &mdash; plan elements</h3>'
      + '<div class="r"><span class="eyebrow">findings / inspections per element</span></div></div>'
    + '<div>' + GP.map(([grp, items], gi) => {
        const open = state.planOpen[gi] !== false;
        const gf = items.reduce((n,x) => n + x[1], 0);
        return '<div class="plan-group"><button class="plan-gh" data-plan="'+gi+'" aria-expanded="'+open+'">'
          + '<span class="seq">'+String(gi+1).padStart(2,"0")+'</span><span class="t">'+grp+'</span>'
          + '<span class="m">'+(gf ? '<span class="chip grey">'+gf+' findings</span>' : '<span class="eyebrow">not started</span>')
          + '<span class="caret">'+svg(I.chev,2)+'</span></span></button>'
          + (open ? items.map(it => '<div class="plan-item">'
              + '<span class="sd '+(it[3]||"")+'"></span><span class="t">'+it[0]+'</span>'
              + '<span class="ct">'+(it[1] ? '<b>'+it[1]+'</b>' : "0")+' / '+it[2]+'</span>'
              + '<button class="flink" data-act="soon">add</button></div>').join("") : "")
          + '</div>'; }).join("")
    + '</div>'
    + '<div class="plan-legend">' + Object.keys(ST).map(k => '<span><i style="background:'+ST[k].pin+'"></i>'+ST[k].t+'</span>').join("")
    + '<span style="margin-left:auto"><button class="flink" data-act="soon">Download inspection files for this project</button></span></div>'
    + '</section></div>';
}

  const issues = i.findings.filter(f => (f.st === "attn" || f.st === "ready") && f.c).slice(0, 6);
  return '<div class="closebar">'
    + '<button class="btn" data-act="close">'+svg(I.back)+'Back to inspection</button>'
    + '<span class="chip grey">external view &mdash; no MFA login required</span></div>'
    + '<div style="max-width:720px; margin:0 auto"><div class="portal">'
    + '<div class="portal-h"><div><div class="brandline">sitetrack.io &middot; contractor portal</div>'
      + '<h2>'+p.ref+' &mdash; '+p.name+'</h2>'
      + '<div style="font-size:12px; color:#8FA8A4; margin-top:4px">Inspection '+i.no+' &middot; '+i.type+' &middot; '+i.date
      + ' &middot; issued by '+i.by+', MFA Consulting Engineers</div></div>'
      + '<div class="refbox"><div class="k">Reference</div><div class="v">'+(i.portal||"918-769")+'</div></div></div>'
    + '<div class="portal-b">'
    + '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px">'
      + '<span class="chip pchip">'+svg(I.cam,2)+' photos on every entry</span>'
      + '<span class="chip pchip">'+issues.length+' open items</span>'
      + '<span class="chip pchip">'+i.images+' photos</span>'
      + '<span class="chip pchip">drawing: '+i.drawing+'</span></div>'
    + issues.map((f,idx) => {
        const th = PORTAL_THREADS[i.no+"/"+f.n] || [];
        return '<div class="pissue"><div class="top">'
        + '<div style="flex:1; min-width:0"><div class="ref"># '+i.no+' / '+f.n+'</div>'
        + '<h4>'+f.c+'</h4><div class="el">'+f.el+' &middot; pinned on '+i.drawing+' &middot; '+f.time+'</div></div>'
        + '<span class="chip '+ST[f.st].c+'" style="flex:none">'+ST[f.st].t+'</span></div>'
        + '<div class="pphotos">'
        + [1,2,3].map(function(n){ return '<div class="pphoto"><span>'+ (f.n) + '.' + n + '</span></div>'; }).join("")
        + '<div class="pphoto map">'+mapmini(f.gps)+'</div></div>'
        + '<div class="pphoto-cap">3 photos from this inspection, plus the pinned location on '+i.drawing+'. '
        + '<button class="flink" data-act="soon" style="color:#7FE9E2">Download originals</button></div>'
        + '<div class="pthread">'
        + '<div class="pmsg"><div class="av">'+initials(i.by)+'</div><div class="bd">'
          + '<div class="who">'+i.by+'<span>MFA &middot; '+i.date+'</span></div>'
          + '<p>Raised on site. Photo and pin location attached.</p></div></div>'
        + th.map(m => '<div class="pmsg"><div class="av">'+initials(m.who)+'</div><div class="bd">'
          + '<div class="who">'+m.who+'<span>'+m.co+' &middot; just now</span></div><p>'+m.txt+'</p></div></div>').join("")
        + '</div>'
        + '<div class="passign">'
        + (f.assignee
            ? '<span class="chip pchip">'+svg(I.users,1.9)+' '+f.assignee+(f.due?' &middot; due '+f.due:'')+'</span>'
              + '<span class="chip pchip">tracked on the MFA task schedule</span>'
            : '<span style="font-size:11.5px; color:#8FA8A4">No action owner yet.</span>')
        + '<button class="btn sm" data-act="assign" data-ino="'+i.no+'" data-fn="'+f.n+'" data-from="portal" style="margin-left:auto">'
        + svg(I.users)+(f.assignee?'Reassign':'Assign action')+'</button></div>'
        + '<div class="preply"><input placeholder="Reply as contractor&hellip;" data-reply="'+i.no+"/"+f.n+'" aria-label="Reply">'
        + '<button class="btn sm accent" data-act="preply" data-key="'+i.no+"/"+f.n+'">'+svg(I.send)+'Send</button>'
        + '<button class="btn sm" data-act="pclose" data-ino="'+i.no+'" data-fn="'+f.n+'">Mark resolved</button></div>'
        + '</div>'; }).join("")
    + (issues.length ? "" : '<div style="padding:24px; text-align:center; color:#8FA8A4; font-size:12.5px">No open items on this inspection.</div>')
    + '<p style="font-size:11px; color:#7C948F; margin-top:6px">Contractors, clients and project team members reach this page from the report link or by entering the reference number. Replies and status changes flow straight back to the inspection record in MFA.</p>'
    + '</div></div></div>';

const scrim = document.getElementById("scrim"), sheetwrap = document.getElementById("sheetwrap");
const modalWrap = document.getElementById("modalwrap"), modal = document.getElementById("modal");
function showSheet(html){
  sheetwrap.innerHTML = html; sheetwrap.classList.add("on"); scrim.classList.add("on");
  sheetwrap.scrollTop = 0;
}
function showModal(html, cls){
  modal.className = "modal" + (cls ? " " + cls : "");
  modal.innerHTML = html; modalWrap.style.display = "grid"; scrim.classList.add("on");
  requestAnimationFrame(() => modal.classList.add("on"));
}
function closeAll(){
  sheetwrap.classList.remove("on"); modal.classList.remove("on");
  modalWrap.style.display = "none"; scrim.classList.remove("on");
}

function render(){
  const m = document.getElementById("main");
  document.body.classList.toggle("not-office", state.shell !== "office");
  if(state.shell === "home"){ m.innerHTML = viewHome(); return; }
  if(state.shell === "mobile"){ m.innerHTML = viewMobile(); return; }
  if(state.shell === "portal"){ m.innerHTML = viewPortalShell(); return; }

/* drag a task between people and days */
const clearDrop = () => document.querySelectorAll(".cal-cell.drop-on").forEach(c => c.classList.remove("drop-on"));
document.addEventListener("dragstart", e => {
  const c = e.target.closest && e.target.closest(".ctask[data-tid]");
  if(!c) return;
  const cell = c.closest("[data-cell]");
  state.drag = {id:c.dataset.tid, from:cell ? cell.dataset.cell : null};
  try{ e.dataTransfer.setData("text/plain", c.dataset.tid); e.dataTransfer.effectAllowed = "copyMove"; }catch(err){}
  c.classList.add("dragging");
});
document.addEventListener("dragend", e => {
  document.querySelectorAll(".ctask.dragging").forEach(c => c.classList.remove("dragging"));
  clearDrop(); state.drag = null;
});
document.addEventListener("dragover", e => {
  if(!state.drag) return;
  const cell = e.target.closest && e.target.closest("[data-cell]");
  if(!cell) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = e.altKey ? "copy" : "move";
  if(!cell.classList.contains("drop-on")){ clearDrop(); cell.classList.add("drop-on"); }
});
document.addEventListener("drop", e => {
  if(!state.drag) return;
  const cell = e.target.closest && e.target.closest("[data-cell]");
  if(!cell) return;
  e.preventDefault();
  const parts = cell.dataset.cell.split("|"), who = parts[0], date = parts[1];
  const fromWho = state.drag.from ? state.drag.from.split("|")[0] : null;
  const t = taskById(state.drag.id);
  clearDrop(); state.drag = null;
  if(!t) return;
  const movedDay = t.date !== date;
  t.date = date;
  let msg;
  if(who === fromWho){
    msg = movedDay ? "Moved to " + date : "Nothing changed";
  } else if(e.altKey){
    if(t.who.indexOf(who) < 0) t.who.push(who);
    msg = who + " added \u2014 now shared with " + t.who.join(", ");
  } else {
    t.who = t.who.map(x => x === fromWho ? who : x).filter((x,i,a) => a.indexOf(x) === i);
    msg = "Moved to " + who + (movedDay ? " on " + date : "");
  }
  render(); toast(msg);
});

  const r = document.documentElement;
  const dark = r.dataset.theme === "dark" || (!r.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark"; themeIcon();
});

const fRow = (p, key, label, opts) => {
  opts = opts || {};
  const at = opts.at || "set";
  const bind = 'data-'+(at === "set" ? "set" : "dset")+'="'+key+'"';
  const v = p.set[key] === undefined ? "" : p.set[key];
  if(opts.type === "check")
    return '<div class="srow"><label>'+label+'</label>'
      + '<button class="tick'+(v?" on":"")+'" data-'+(at === "set" ? "setchk" : "dchk")+'="'+key+'"'
      + ' aria-pressed="'+!!v+'" aria-label="'+label+'">'+svg(I.check)+'</button></div>';
  if(opts.type === "select")
    return '<div class="srow"><label>'+label+'</label><select '+bind+'>'
      + (opts.blank ? '<option value=""></option>' : '')
      + opts.options.map(o => '<option'+(String(v)===o?" selected":"")+'>'+o+'</option>').join("") + '</select></div>';
  if(opts.type === "area")
    return '<div class="srow"><label>'+label+'</label><textarea '+bind+' rows="2" maxlength="250">'+v+'</textarea></div>';
  return '<div class="srow"><label>'+label+'</label><input '+bind+' value="'+String(v).replace(/"/g,"&quot;")+'"'
    + (opts.ph?' placeholder="'+opts.ph+'"':'') + (opts.ro?' readonly':'') + '></div>';
};

const DAYNAMES = ["Mon","Tue","Wed","Thu","Fri"];
const MONTHS3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function weekDates(off, weeks){
  const base = new Date(2026, 7, 24);
  base.setDate(base.getDate() + off * 7);
  const n = 5 * (weeks || 1);
  return Array.from({length:n}, (_,i) => {
    const wk = Math.floor(i / 5);
    i = wk * 7 + (i % 5);
    const d = new Date(base); d.setDate(base.getDate() + i);
    return {key:String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(),
      lbl:DAYNAMES[i % 7], num:d.getDate(), mon:MONTHS3[d.getMonth()], wk:Math.floor(i / 7)};
  });
}

  + '<div class="mnote warn">'+svg(I.alert,1.9)+'<span>2 findings have no pin. They will still appear in the report but not on the drawing.</span></div>'
  + '<div class="srow"><label>Overall comments</label><textarea rows="3" placeholder="Anything for the record"></textarea></div>'
  + '<div class="srow"><label>Signed on site by</label><input value="Darren Gilsenan" readonly></div>'
  + '<button class="btn accent" style="justify-content:center" data-mscreen="day"'
  + ' data-mtoast="Inspection 002 submitted \u2014 PDF generated, portal reference 902-139">'+svg(I.send)+'Submit &amp; generate report</button>'
  + '<button class="btn" style="justify-content:center" data-mscreen="findings" data-mtoast="Saved as draft">Keep as draft</button>'
  + '<div class="mnote">'+svg(I.link,1.9)+'<span>Submitting creates the contractor portal link and emails it to the site team.</span></div>'
  + '</div>'};

/* ---- 13. issue thread ---- */
MOB.issue = {n:"Issue thread", note:"The same thread the contractor sees in the portal. An engineer can close an item out from site the moment they have verified it.",
  r:() => mHead("# 001 / 005", "0464P &middot; External Works", "project")
  + '<div class="mbody">'
  + '<div style="padding:12px 12px 0"><div class="mrow-t" style="font-size:13.5px">No piers or expansion joints in boundary wall. What has been done here?</div>'
  + '<div class="row wrap" style="gap:6px; margin-top:8px">'+stChip("attn")
  + '<span class="chip grey">raised 25.02.2026</span><span class="chip noissue">Bianca Fachin &middot; due 22.08</span></div></div>'
  + '<div class="mphoto" style="margin:12px"><span class="tag">photo 005</span></div>'
  + mSect("Thread")
  + '<div class="mmsgs">'
    + [["Mark Forbes","MFA","25.02.2026","Raised on site. Photo and pin location attached."],
       ["Sean Walsh","Walsh Bros","04.03.2026","Detail queried with the blocklayer. Awaiting revised drawing from MFA."],
       ["Bianca Fachin","MFA","09.03.2026","Revised detail issued, drawing 2431-S-118 rev E."],
       ["Mark Forbes","MFA","12.06.2026","Re-inspected. Piers built, expansion joints still outstanding."]]
      .map(m => '<div class="mmsg"><span class="avatar sm">'+initials(m[0])+'</span>'
      + '<div><div class="mmsg-h">'+m[0]+'<span>'+m[1]+' &middot; '+m[2]+'</span></div><p>'+m[3]+'</p></div></div>').join("")
  + '</div>'
  + '<div style="padding:12px; display:flex; flex-direction:column; gap:8px">'
    + '<div class="srow"><label>Reply</label><input placeholder="Add to the thread"></div>'
    + '<div style="display:flex; gap:8px"><button class="btn" style="flex:1; justify-content:center" data-mscreen="capture">'+svg(I.cam)+'Photo</button>'
    + '<button class="btn accent" style="flex:1; justify-content:center" data-mscreen="project"'
    + ' data-mtoast="# 001 / 005 resolved \u2014 contractor notified">'+svg(I.check)+'Mark resolved</button></div>'
  + '</div></div>'};

/* ---- 14. log time ---- */
MOB.time = {n:"Log time", note:"Hours booked against the task on the phone, at the end of the visit, while the day is still accurate. General time has its own categories so it never lands on a fee account.",
  r:() => { const ts = myTasks();
    return mHead("Log time", "Wednesday 26 August &middot; " + state.mobLogged + "h logged")
    + '<div class="mbody">'
    + mSect("Against a task")
    + ts.map(t => mRow(t.t, (t.pid||"General") + " &middot; " + t.estH + "h estimated",
        '<span class="chip '+(loggedH(t)?"resolved":"grey")+'">'+(loggedH(t)||0)+'h</span>',
        {to:"time", mtoast:"Add hours below for: " + t.t.slice(0,38)})).join("")
    + mSect("Add an entry")
    + '<div style="padding:0 12px 12px; display:flex; flex-direction:column; gap:10px">'
      + '<div class="srow"><label>Task</label><select>'
        + ts.map(t => '<option>'+(t.pid?t.pid+" - ":"")+t.t.slice(0,40)+'</option>').join("")
        + '<option>General - travel</option><option>General - office admin</option></select></div>'
      + '<div style="display:flex; gap:9px"><div class="srow" style="flex:1"><label>Hours</label><input value="2.5"></div>'
      + '<div class="srow" style="flex:1"><label>Date</label><input value="26.08.2026"></div></div>'
      + '<div class="srow"><label>Note</label><input placeholder="What was done"></div>'
      + '<button class="btn accent" style="justify-content:center" data-mact="loghours">'+svg(I.clock)+'Log 2.5 hours</button>'
    + '</div></div>' + mTabs("time"); }};

/* ---------- the mobile shell ---------- */
function viewMobile(){
  const k = state.mscreen || "day";
  const sc = MOB[k] || MOB.day;
  const all = MOB_GROUPS.reduce((n,g) => n + g[1].length, 0);
  const idx = MOB_GROUPS.flatMap(g => g[1]).indexOf(k) + 1;
  if(state.mobAll) return mobileGallery();
  return '<div class="wshell">'
  + '<aside class="wnav">'
    + '<button class="wback" data-shell="home">'+svg(I.back,2)+'All portals</button>'
    + '<div class="wnav-h"><div class="eyebrow">Frontend wireframes</div>'
      + '<h2>Engineer mobile app</h2>'
      + '<p>For MFA team members running their own projects on site. '+all+' screens.</p>'
      + '<button class="btn sm" data-act="moball">'+svg(I.layers)+'View all screens</button></div>'
    + MOB_GROUPS.map(g => '<div class="wgrp"><div class="eyebrow">'+g[0]+'</div>'
      + g[1].map(x => '<button class="wnav-i'+(x===k?" on":"")+'" data-mscreen="'+x+'">'
        + '<span class="wnum">'+String(MOB_GROUPS.flatMap(y=>y[1]).indexOf(x)+1).padStart(2,"0")+'</span>'
        + MOB[x].n+'</button>').join("")+'</div>').join("")
  + '</aside>'
  + '<div class="wstage">'
    + '<div class="wcap"><div class="eyebrow">Screen '+idx+' of '+all+'</div><h3>'+sc.n+'</h3><p>'+sc.note+'</p>'
      + '<div class="wcap-f">'+svg(I.phone,1.8)+'<span>Works offline. Syncs when signal returns.</span></div></div>'
    + '<div class="phone2"><div class="p2-notch"><i></i></div>'
      + '<div class="p2-status"><span>09:41</span><span>'+svg(I.pin,2)+' GPS</span><span>4G</span></div>'
      + '<div class="p2-body">'+sc.r()+'</div></div>'
  + '</div></div>';
}
function mobileGallery(){
  const keys = MOB_GROUPS.flatMap(g => g[1]);
  return '<div class="wgal">'
  + '<div class="wgal-h"><button class="wback" data-shell="home">'+svg(I.back,2)+'All portals</button>'
    + '<div><div class="eyebrow">Frontend wireframes</div><h2>Engineer mobile app &middot; '+keys.length+' screens</h2></div>'
    + '<button class="btn sm" data-act="mobone" style="margin-left:auto">'+svg(I.phone)+'Click through</button></div>'
  + '<div class="wgal-grid">'
  + keys.map((x,i) => '<div class="wgal-i"><div class="wgal-cap"><span class="wnum">'+String(i+1).padStart(2,"0")+'</span>'+MOB[x].n+'</div>'
    + '<div class="phone2 sm" role="button" tabindex="0" data-mscreen="'+x+'" data-act="mobone">'
    + '<div class="p2-notch"><i></i></div><div class="p2-body">'+MOB[x].r()+'</div></div></div>').join("")
  + '</div></div>';
}

/* ==================================================================

   ================================================================== */

  {k:"office", i:I.gauge, t:"Office &amp; backend app",

   badge:"Backend wireframes &middot; 12 sections", meta:"Built and clickable"},
  {k:"mobile", i:I.phone, t:"Engineer mobile app",
   d:"What a team member uses on site for their own projects. Sign in &rarr; today&#39;s tasks &rarr; open a project &rarr; start a BCAR or non-BCAR inspection &rarr; photo with date, time and GPS &rarr; pin it on the drawing &rarr; review and submit. Works offline.",
   badge:"Frontend wireframes &middot; 14 screens", meta:"New in this round"},
  {k:"portal", i:I.link, t:"Contractor portal",

];

    + '<h3>'+p.t+'</h3><p>'+p.d+'</p>'
    + '<span class="hcard-badge">'+p.badge+'</span>'

    + '<div style="padding:0 22px 50px">' + portalSheet(p, i) + '</div>';

themeIcon(); render();
